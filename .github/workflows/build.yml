name: Hisabati
options:
  bundleIdPrefix: org.hisabati
  deploymentTarget:
    iOS: "16.0"
targets:
  Hisabati:
    type: application
    platform: iOS
    sources: [Hisabati]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Hisabati
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.hisabati.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
